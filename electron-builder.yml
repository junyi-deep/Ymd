appId: com.ymd.editor
productName: Ymd
beforePack: scripts/build-window-backdrop.cjs
directories:
  output: release
files:
  - dist/**/*
  - package.json
mac:
  asarUnpack:
    - dist/main/window-shadow.dylib
    - "**/node_modules/@koromix/koffi-darwin-arm64/**"
  identity: "-"
  hardenedRuntime: false
  icon: build/icon.icns
  extendInfo:
    NSMicrophoneUsageDescription: Ymd 使用麦克风为思维导图主题录制语音备注。
  extraResources:
    - from: node_modules/@vscode/ripgrep-universal/bin/darwin-arm64/rg
      to: ripgrep/rg
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
toolsets:
  nsis: "1.2.1"
win:
  asarUnpack:
    - "**/node_modules/@koromix/koffi-win32-x64/**"
    - dist/main/window-backdrop.dll
  icon: build/icon.ico
  extraResources:
    - from: node_modules/@vscode/ripgrep-universal/bin/win32-x64/rg.exe
      to: ripgrep/rg.exe
  target:
    - target: nsis
      arch: [x64]
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
extraResources:
  - from: node_modules/@vscode/ripgrep-universal/LICENSE
    to: ripgrep/LICENSE
