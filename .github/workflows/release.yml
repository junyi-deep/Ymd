name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: mac-arm64
            platform: mac
            arch: arm64
            ext: dmg
          - runner: windows-2025
            target: win-x64
            platform: win
            arch: x64
            ext: exe
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Check version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "The tag must match v$version." >&2
            exit 1
          fi
          echo "YMD_VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - name: Check native window material
        run: node node_modules/electron/cli.js scripts/check-window-material.cjs
      - name: Check Markdown drag selection
        run: node node_modules/electron/cli.js scripts/check-markdown-selection.cjs
      - name: Check Markdown scrolling
        run: node node_modules/electron/cli.js scripts/check-markdown-scroll.cjs
      - name: Check Markdown HTML and editor find/replace
        run: node node_modules/electron/cli.js scripts/check-markdown-html-find.cjs
      - name: Check code editing and diagram previews
        run: node node_modules/electron/cli.js scripts/check-code-diagrams.cjs
      - name: Check Git diff and history selection
        run: node node_modules/electron/cli.js scripts/check-git-diff.cjs
      - name: Check startup and document opening
        run: node node_modules/electron/cli.js scripts/check-file-opening.cjs
      - name: Package
        run: npm exec -- electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify macOS update bundle
        if: matrix.platform == 'mac'
        run: codesign --verify --deep --strict release/mac-arm64/Ymd.app
      - name: Verify Windows update installer
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./scripts/check-windows-installer.ps1 -Version $env:YMD_VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() && matrix.platform == 'win'
        with:
          name: failed-windows-window-capture
          path: ${{ runner.temp }}/ymd-windows-window.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}
          path: release/Ymd-${{ env.YMD_VERSION }}-${{ matrix.target }}.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          assets=("release/Ymd-$version-mac-arm64.dmg" "release/Ymd-$version-win-x64.exe")
          for asset in "${assets[@]}"; do test -s "$asset"; done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            options=()
            if [[ "$version" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes "${options[@]}"
          fi
